name: appointment_app
description: Smart Slot Booking System – Appointment App
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.4

  # State Management
  provider: ^6.1.2

  # Session Persistence
  shared_preferences: ^2.2.2

  # Calendar Widget
  table_calendar: ^3.0.9

  # REST API
  http: ^1.2.1

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.68.0

  # Date Formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/app_icon.png'
  adaptive_icon_background: '#1F4E79'
  adaptive_icon_foreground: 'assets/icon/app_icon_fg.png'
  min_sdk_android: 21

flutter_native_splash:
  color: '#1F4E79'
  image: 'assets/splash/splash_logo.png'
  android_12:
    color: '#1F4E79'
    image: 'assets/splash/splash_logo.png'
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
